[package]
name = "frontend"
version = "0.1.0"
edition = "2024"
description = "Web-Oberfläche in Leptos: Spektrum, Wasserfall und AIS-Karte"

[dependencies]
api = { path = "../api" }
console_error_panic_hook = "0.1.7"
futures = "0.3.34"
gloo-net = { version = "0.7.0", default-features = false, features = ["websocket", "http", "json"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
serde = "1.0.229"
serde_json = "1"
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "CanvasRenderingContext2d",
    "console",
    "DomRect",
    "HtmlCanvasElement",
    "HtmlDivElement",
    "ImageData",
    "KeyboardEvent",
    "Location",
    "PointerEvent",
    "ResizeObserver",
    "TextMetrics",
    "WheelEvent",
    "Window",
]

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectrum Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sea: #0e2233;       /* Hintergrund */
    --hull: #132c40;      /* Bedienfeld */
    --grid: #24445c;      /* Raster */
    --text: #cfdde8;
    --muted: #7f9ab0;
    --trace: #f2b544;     /* Messkurve */
    --marker: #5cc8e0;    /* Marker */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--sea); color: var(--text);
    font: 16px/1.4 "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    display: grid; grid-template-rows: auto minmax(0, 1fr);
  }
  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 2rem;
    padding: .75rem 1.25rem; border-bottom: 1px solid var(--grid);
  }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 auto 0 0; }
  .readout { display: flex; gap: .4rem; align-items: baseline; }
  .readout span:first-child { color: var(--muted); }
  .readout strong { font-weight: 500; font-size: 1.1rem; }
  #status { color: var(--muted); }
  #status.live { color: var(--trace); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 15rem; min-height: 0; }
  .scope {
    position: relative; display: grid; grid-template-rows: minmax(0, 2fr) minmax(0, 3fr);
    min-height: 0; outline: none; cursor: crosshair;
  }
  .scope:focus-visible { box-shadow: inset 0 0 0 2px var(--marker); }
  .pane { position: relative; min-height: 0; }
  .pane canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pane + .pane { border-top: 1px solid var(--grid); }

  .cursor {
    position: absolute; top: 0; bottom: 0; width: 1px;
    background: var(--marker); pointer-events: none; display: none;
  }
  .tag {
    position: absolute; top: .5rem; padding: .3rem .6rem;
    background: var(--marker); color: var(--sea);
    font-weight: 600; white-space: pre; pointer-events: none; display: none;
  }

  aside {
    background: var(--hull); padding: 1.25rem; border-left: 1px solid var(--grid);
    display: flex; flex-direction: column; gap: 1.25rem;
  }
  label { display: grid; gap: .25rem; }
  label output { justify-self: end; }
  .row { display: flex; justify-content: space-between; }
  input[type=range] { width: 100%; accent-color: var(--trace); }
  .check { display: flex; gap: .5rem; align-items: center; }
  .check input { accent-color: var(--trace); width: 1.1rem; height: 1.1rem; }
  button {
    font: inherit; font-weight: 600; padding: .5rem; border-radius: 3px;
    background: transparent; color: var(--text); border: 1px solid var(--muted); cursor: pointer;
  }
  button:hover { border-color: var(--text); }
  :focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: .9rem; margin: auto 0 0; }

  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; }
    aside { border-left: 0; border-top: 1px solid var(--grid); }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Spectrum Monitor</h1>
  <div class="readout"><span>Mitte</span><strong id="center">–</strong></div>
  <div class="readout"><span>Span</span><strong id="span">–</strong></div>
  <div class="readout"><span>RBW</span><strong id="rbw">–</strong></div>
  <div class="readout"><span>Detektor</span><strong id="det">–</strong></div>
  <div id="status" role="status">Verbinde…</div>
</header>
<main>
  <div class="scope" id="scope" tabindex="0" aria-label="Spektrum und Wasserfall. Pfeiltasten bewegen den Marker.">
    <div class="pane"><canvas id="spec"></canvas></div>
    <div class="pane"><canvas id="wf"></canvas></div>
    <div class="cursor" id="cursor"></div>
    <div class="tag" id="tag"></div>
  </div>
  <aside>
    <label><div class="row"><span>Referenzpegel</span><output id="refOut"></output></div>
      <input type="range" id="ref" min="-60" max="10" step="1" value="-10"></label>
    <label><div class="row"><span>Anzeigebereich</span><output id="rangeOut"></output></div>
      <input type="range" id="range" min="20" max="120" step="5" value="70"></label>
    <label class="check"><input type="checkbox" id="hold"> Max-Hold</label>
    <button id="pause">Anhalten</button>
    <p class="hint">Mit der Maus oder den Pfeiltasten misst der Marker Frequenz und Pegel. Umschalt + Pfeil springt weiter.</p>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const spec = $('spec'), wf = $('wf'), scope = $('scope');
const sctx = spec.getContext('2d'), wctx = wf.getContext('2d');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { sea: css('--sea'), grid: css('--grid'), muted: css('--muted'), trace: css('--trace'), marker: css('--marker') };

let meta = null, latest = null, hold = null, paused = false, markerX = null;
let ref = +$('ref').value, range = +$('range').value;

// Farbskala des Wasserfalls: Meerestiefe bis Signalspitze.
const LUT = (() => {
  const stops = [[0, '#0e2233'], [.35, '#1f5f7a'], [.6, '#5cc8e0'], [.82, '#f2b544'], [1, '#fff6e0']];
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const lut = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255, k = stops.findIndex(s => s[0] >= t);
    const [t0, c0] = stops[Math.max(k - 1, 0)], [t1, c1] = stops[k];
    const f = t1 === t0 ? 0 : (t - t0) / (t1 - t0);
    const a = rgb(c0), b = rgb(c1);
    for (let j = 0; j < 3; j++) lut[i * 3 + j] = a[j] + (b[j] - a[j]) * f;
  }
  return lut;
})();

function fit(c) {
  const r = c.getBoundingClientRect(), d = devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; return true; }
  return false;
}
new ResizeObserver(() => { fit(spec); if (fit(wf)) wctx.fillStyle = C.sea, wctx.fillRect(0, 0, wf.width, wf.height); draw(); }).observe(scope);

// Mehrere Bins pro Pixel: Maximum nehmen, damit schmale Signale nicht verschwinden.
function toPixels(v, w) {
  const out = new Float32Array(w), n = v.length;
  for (let x = 0; x < w; x++) {
    const a = Math.floor(x * n / w), b = Math.max(a + 1, Math.floor((x + 1) * n / w));
    let m = -Infinity;
    for (let i = a; i < b; i++) if (v[i] > m) m = v[i];
    out[x] = m;
  }
  return out;
}

const freqAt = f => meta.center_hz - meta.sample_rate / 2 + f * meta.sample_rate;
const mhz = hz => (hz / 1e6).toFixed(3) + ' MHz';
const db = v => v.toFixed(1).replace('-', '−') + ' dBFS';

function draw() {
  const W = spec.width, H = spec.height, d = devicePixelRatio || 1;
  sctx.fillStyle = C.sea; sctx.fillRect(0, 0, W, H);
  if (!meta) return;

  // Raster: 10 × 10 Teilungen wie am Messgerät.
  sctx.strokeStyle = C.grid; sctx.lineWidth = 1; sctx.beginPath();
  for (let i = 1; i < 10; i++) {
    const x = Math.round(i * W / 10) + .5, y = Math.round(i * H / 10) + .5;
    sctx.moveTo(x, 0); sctx.lineTo(x, H); sctx.moveTo(0, y); sctx.lineTo(W, y);
  }
  sctx.stroke();

  sctx.fillStyle = C.muted; sctx.font = `${13 * d}px "Barlow Semi Condensed", sans-serif`;
  sctx.textBaseline = 'top';
  for (let i = 0; i < 10; i += 2) sctx.fillText((ref - i * range / 10).toFixed(0).replace('-', '−'), 6 * d, i * H / 10 + 4 * d);
  sctx.textBaseline = 'bottom';
  for (let i = 1; i < 10; i += 2) {
    const t = (freqAt(i / 10) / 1e6).toFixed(3);
    sctx.fillText(t, i * W / 10 - sctx.measureText(t).width / 2, H - 4 * d);
  }

  const y = v => (ref - v) / range * H;
  const line = (v, color, dash) => {
    const px = toPixels(v, W);
    sctx.strokeStyle = color; sctx.lineWidth = 1.5 * d; sctx.setLineDash(dash);
    sctx.beginPath();
    for (let x = 0; x < W; x++) x ? sctx.lineTo(x, y(px[x])) : sctx.moveTo(x, y(px[x]));
    sctx.stroke(); sctx.setLineDash([]);
  };
  if (hold) line(hold, C.muted, [4 * d, 4 * d]);
  if (latest) line(latest, C.trace, []);
  updateMarker();
}

function pushWaterfall(v) {
  const W = wf.width, H = wf.height;
  wctx.drawImage(wf, 0, 0, W, H - 1, 0, 1, W, H - 1);
  const px = toPixels(v, W), row = wctx.createImageData(W, 1), lo = ref - range;
  for (let x = 0; x < W; x++) {
    const k = Math.max(0, Math.min(255, ((px[x] - lo) / range * 255) | 0)) * 3;
    row.data.set([LUT[k], LUT[k + 1], LUT[k + 2], 255], x * 4);
  }
  wctx.putImageData(row, 0, 0);
}

function updateMarker() {
  const show = markerX !== null && meta && latest;
  $('cursor').style.display = $('tag').style.display = show ? 'block' : 'none';
  if (!show) return;
  const w = scope.clientWidth, f = markerX / w;
  const bin = Math.min(latest.length - 1, Math.floor(f * latest.length));
  $('cursor').style.left = markerX + 'px';
  const tag = $('tag');
  tag.textContent = `${mhz(freqAt(f))}   ${db(latest[bin])}`;
  const tw = tag.offsetWidth;
  tag.style.left = (markerX + 8 + tw > w ? markerX - 8 - tw : markerX + 8) + 'px';
}

scope.addEventListener('pointermove', e => { markerX = e.clientX - scope.getBoundingClientRect().left; updateMarker(); });
scope.addEventListener('pointerleave', () => { if (document.activeElement !== scope) { markerX = null; updateMarker(); } });
scope.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  const w = scope.clientWidth, step = e.shiftKey ? w / 10 : 1;
  markerX = Math.max(0, Math.min(w - 1, (markerX ?? w / 2) + (e.key === 'ArrowLeft' ? -step : step)));
  updateMarker();
});

const bind = (id, out, fmt, set) => {
  const el = $(id), o = $(out);
  const f = () => { set(+el.value); o.textContent = fmt(+el.value); draw(); };
  el.addEventListener('input', f); f();
};
bind('ref', 'refOut', v => v.toString().replace('-', '−') + ' dBFS', v => ref = v);
bind('range', 'rangeOut', v => v + ' dB', v => range = v);
$('hold').addEventListener('change', e => { hold = e.target.checked && latest ? latest.slice() : null; draw(); });
$('pause').addEventListener('click', e => { paused = !paused; e.target.textContent = paused ? 'Fortsetzen' : 'Anhalten'; });

let queued = false;
function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = e => {
    if (typeof e.data === 'string') {
      meta = JSON.parse(e.data);
      $('center').textContent = mhz(meta.center_hz);
      $('span').textContent = (meta.sample_rate / 1e6).toFixed(1) + ' MHz';
      $('rbw').textContent = (meta.rbw_hz / 1e3).toFixed(2) + ' kHz';
      $('det').textContent = meta.detector === 'Peak' ? 'Spitze' : 'Mittelwert';
      $('status').textContent = 'Live'; $('status').className = 'live';
      return;
    }
    if (paused) return;
    latest = new Float32Array(e.data);
    if ($('hold').checked) {
      if (!hold || hold.length !== latest.length) hold = latest.slice();
      else for (let i = 0; i < hold.length; i++) if (latest[i] > hold[i]) hold[i] = latest[i];
    }
    pushWaterfall(latest);
    if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; draw(); }); }
  };
  ws.onclose = () => {
    $('status').textContent = 'Getrennt, neuer Versuch in 2 s'; $('status').className = '';
    setTimeout(connect, 2000);
  };
}
connect();
</script>
</body>
</html>

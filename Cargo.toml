[package]
name = "spectrum-monitor"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "api", "frontend"]
# Das Frontend baut nur für wasm32, dafür ist `trunk` zuständig.
default-members = [".", "api"]

[dependencies]
api = { path = "api" }
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
mime_guess = "2.0.5"
rand = "0.10.3"
rand_distr = "0.6.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.12.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
tract-onnx = "0.23.8"

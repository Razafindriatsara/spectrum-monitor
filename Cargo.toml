[package]
name = "spectrum-monitor"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "api"]

[dependencies]
api = { path = "api" }
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
rand_distr = "0.6.0"
rustfft = "6.4.1"
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
